[project]
name = "auto-postul"
version = "0.1.0"
description = "Asistente local para descubrir y preparar postulaciones simples en LinkedIn."
readme = "README.md"
requires-python = ">=3.12.4,<3.15"
license = { text = "MIT" }
authors = [{ name = "mylnzon58" }]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "filelock>=3.16",
    "google-genai>=1.0",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "mcp>=2.2,<3",
    "patchright>=1.55",
    "platformdirs>=4.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pypdf>=5.1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_postul = ["web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: prueba un adaptador contra SQLite o HTML sintético",
    "live: requiere LinkedIn real y no corre en CI",
]

[tool.coverage.run]
source = ["auto_postul"]
branch = true
omit = ["src/auto_postul/__main__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "src/auto_postul/web/static/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# B008: Depends/File son el patrón oficial de FastAPI.
# RUF001/RUF002: el español usa guiones y comillas tipográficas.
ignore = ["B008", "RUF001", "RUF002"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["patchright.*", "google.genai.*", "mcp.*", "pypdf.*"]
ignore_missing_imports = true
